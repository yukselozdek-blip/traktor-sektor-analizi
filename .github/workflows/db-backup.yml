name: Traktör Sektör Analizi - Veritabanı Yedeği (Hetzner Storage Box)

# Traktör Sektör Analizi uygulaması: her gece Railway Postgres yedeğini alır, GPG ile şifreler ve Hetzner Storage Box'a yükler.
# Depo herkese açık olduğu için yedek ASLA artifact/commit olarak saklanmaz.
on:
  schedule:
    - cron: '17 1 * * *'   # 01:17 UTC = 04:17 Türkiye saati
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SB_HOST: ${{ secrets.STORAGEBOX_HOST }}
      SB_USER: ${{ secrets.STORAGEBOX_USER }}
      SB_KEY: ${{ secrets.STORAGEBOX_SSH_KEY }}
      SB_KNOWN_HOSTS: ${{ secrets.STORAGEBOX_KNOWN_HOSTS }}
      KEEP: '14'
    steps:
      - name: Gerekli secret'lar tanımlı mı?
        run: |
          missing=0
          for v in DB_URL BACKUP_PASSPHRASE SB_HOST SB_USER SB_KEY SB_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::Secret eksik: $v"; missing=1; fi
          done
          exit $missing

      - name: PostgreSQL 18 istemcisini kur
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-18

      - name: Yedek al ve doğrula
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges --file "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump" "$DB_URL"
          SIZE=$(stat -c %s "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump")
          TABLES=$(/usr/lib/postgresql/18/bin/pg_restore --list "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump" | grep -c "TABLE DATA" || true)
          echo "Yedek boyutu: $SIZE bayt, veri tablosu: $TABLES"
          if [ "$SIZE" -lt 1000000 ] || [ "$TABLES" -lt 50 ]; then
            echo "::error::Yedek şüpheli derecede küçük/eksik (boyut=$SIZE, tablo=$TABLES). Yüklenmeyecek."
            exit 1
          fi

      - name: Şifrele (GPG AES256)
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump.gpg" "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump"
          rm -f "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump"
          ls -l "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump.gpg"

      - name: Storage Box'a yükle ve eskileri temizle
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          # Windows satır sonlarını ve baştaki/sondaki boşlukları temizle
          printf '%s\n' "$SB_KEY" | tr -d '\r' > ~/.ssh/id_backup
          printf '%s\n' "$SB_KNOWN_HOSTS" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/known_hosts_backup
          chmod 600 ~/.ssh/id_backup ~/.ssh/known_hosts_backup

          # Özel anahtar geçerli mi? (açık anahtarı üretebiliyorsak geçerlidir)
          if ! ssh-keygen -y -f ~/.ssh/id_backup >/dev/null 2>key_check.txt; then
            echo "::error::STORAGEBOX_SSH_KEY geçersiz: $(cat key_check.txt). BEGIN/END satırları dahil, anahtarın tamamı yapıştırılmalı."
            exit 1
          fi
          echo "known_hosts satır sayısı: $(grep -c . ~/.ssh/known_hosts_backup)"

          SSH_OPTS="-P 23 -i $HOME/.ssh/id_backup -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_backup -o ConnectTimeout=20"
          SFTP="sftp $SSH_OPTS"
          DEST="$SB_USER@$SB_HOST"

          # Bağlantı denemesi: hata varsa nedeni açıkça görünsün
          if ! printf 'pwd\n' | $SFTP -b - "$DEST" 2> conn_err.txt; then
            echo "::error::Storage Box bağlantısı kurulamadı: $(tr '\n' ' ' < conn_err.txt)"
            exit 1
          fi

          printf -- '-mkdir traktor-sektor-analizi-yedekler\nput traktor-sektor-analizi_hetzner-storagebox_%s.dump.gpg traktor-sektor-analizi-yedekler/traktor-sektor-analizi_hetzner-storagebox_%s.dump.gpg\n' "$STAMP" "$STAMP" | $SFTP -b - "$DEST"

          # Yüklemeyi doğrula
          LOCAL_SIZE=$(stat -c %s "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump.gpg")
          REMOTE_LS=$(printf 'ls -l traktor-sektor-analizi-yedekler\n' | $SFTP -b - "$DEST" || true)
          echo "$REMOTE_LS" | grep "traktor-sektor-analizi_hetzner-storagebox_$STAMP.dump.gpg" | grep -q "$LOCAL_SIZE" \
            || { echo "::error::Yüklenen dosya boyutu doğrulanamadı"; exit 1; }
          echo "Yükleme doğrulandı."

          # Son $KEEP yedek hariç eskileri sil
          printf 'ls -1 traktor-sektor-analizi-yedekler\n' | $SFTP -b - "$DEST" \
            | grep -oE 'traktor-sektor-analizi_hetzner-storagebox_[0-9]{8}-[0-9]{4}\.dump\.gpg' | sort -u > remote_list.txt
          TOTAL=$(wc -l < remote_list.txt)
          if [ "$TOTAL" -gt "$KEEP" ]; then
            head -n $((TOTAL - KEEP)) remote_list.txt | sed 's#^#rm traktor-sektor-analizi-yedekler/#' | $SFTP -b - "$DEST"
            echo "$((TOTAL - KEEP)) eski yedek silindi."
          fi
          echo "Toplam saklanan yedek: $(( TOTAL > KEEP ? KEEP : TOTAL ))"

      - name: Geçici dosyaları sil
        if: always()
        run: rm -f traktor-sektor-analizi_hetzner-storagebox_*.dump traktor-sektor-analizi_hetzner-storagebox_*.dump.gpg remote_list.txt key_check.txt conn_err.txt ~/.ssh/id_backup ~/.ssh/known_hosts_backup
